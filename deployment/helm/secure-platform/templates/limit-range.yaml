apiVersion: v1
kind: LimitRange
metadata:
  name: secure-platform-limits
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi
